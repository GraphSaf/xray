name: Deploy to Server

on:
  push:
    branches:
      - claude/radiation-dose-reporting-app-RM8Cf

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create production env
        run: echo "VITE_POCKETBASE_URL=https://xrayhub.ru" > .env.production

      - name: Build project
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASSWORD}}
          script: |
            if [ -d /var/www/doz3/xray ]; then
              cp -r /var/www/doz3/xray /var/www/doz3/xray.backup.$(date +%Y%m%d_%H%M%S)
              cd /var/www/doz3 && ls -t xray.backup.* | tail -n +4 | xargs -r rm -rf
            fi
            rm -rf /var/www/doz3/xray/*

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASSWORD}}
          source: "dist/*"
          target: "/var/www/doz3/xray/"
          strip_components: 1

      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASSWORD}}
          script: |
            chown -R www-data:www-data /var/www/doz3/xray
            chmod -R 755 /var/www/doz3/xray
            echo "Deployment completed!"
