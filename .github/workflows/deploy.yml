name: Deploy to Server

on:
  push:
    branches:
      - claude/radiation-dose-reporting-app-RM8Cf

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create production env
        run: echo "VITE_POCKETBASE_URL=https://xrayhub.ru" > .env.production

      - name: Build project
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            # Сохраняем папку models если она есть
            if [ -d /var/www/doz3/models ]; then
              cp -r /var/www/doz3/models /tmp/doz3-models-backup
            fi

            # Создаем бэкап и удаляем старые
            if [ -d /var/www/doz3 ]; then
              cp -r /var/www/doz3 /var/www/doz3.backup.$(date +%Y%m%d_%H%M%S)
              cd /var/www && ls -t doz3.backup.* | tail -n +4 | xargs -r rm -rf
            fi

            # Удаляем содержимое
            rm -rf /var/www/doz3/*

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          source: "dist/*"
          target: "/var/www/doz3/"
          strip_components: 1

      - name: Restore models and set permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            # Восстанавливаем папку models из бэкапа
            if [ -d /tmp/doz3-models-backup ]; then
              cp -r /tmp/doz3-models-backup /var/www/doz3/models
              rm -rf /tmp/doz3-models-backup
              echo "Models folder restored from backup"
            fi

            # Устанавливаем права
            chown -R www-data:www-data /var/www/doz3
            chmod -R 755 /var/www/doz3
            echo "Deployment completed!"
